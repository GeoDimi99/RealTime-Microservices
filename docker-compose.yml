
services:
  
  redis:
    image: "redis:8.4"
    cpuset: "1"
    container_name: redis
    ports:
      - "6379:6379"

  deploy-manager:
    build:
      context: . 
      dockerfile: ./services/deploy-manager/Dockerfile
    cpuset: "1"
    container_name: deploy-manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
    

  execution-manager:
    build:
      context: . 
      dockerfile: ./services/execution-manager/Dockerfile
    cpuset: "1"
    container_name: execution-manager
    cap_add:
      - SYS_NICE  # Allows real-time scheduling (SCHED_FIFO/SCHED_RR)
    depends_on:
     - redis
     # Note: deploy-manager is not a dependency because we only need Redis data,
     # not a running deploy-manager process. This prevents container recreation.
  

