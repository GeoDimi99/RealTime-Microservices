version: "1.0"

images:
  base: "geodimi99/realtime-microservices:task-wrapper"
  repo: "geodimi99/realtime-microservices"
  tasks:
    - alias: "sum"
      src: "sum"
    - alias: "subtract"
      src: "subtract"

schedule:
  name: "Configurable CPU/IO Benchmark"
  description: "Benchmark with configurable CPU/IO ratio using total_ops and io_percentage parameters"
  
  tasks:
    # Pure CPU workload
    - id: 1
      image: "sum"
      start: 10
      deadline: 30
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 1000
        io_percentage:
          type: int
          value: 50      
      outputs:
        result:
          type: int

    - id: 2
      image: "sum"
      start: 20
      deadline: 40
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 1000
        io_percentage:
          type: int
          value: 50      
      outputs:
        result:
          type: int


    - id: 3
      image: "subtract"
      start: 30
      deadline: 50
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        a:
          type: int
          value: 100
        b:
          type: int
          value: 50
      outputs:
        result:
          type: int


    - id: 4
      image: "subtract"
      start: 40
      deadline: 60
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        a:
          type: int
          value: 100
        b:
          type: int
          value: 50
      outputs:
        result:
          type: int


    - id: 5
      image: "subtract"
      start: 50
      deadline: 70
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        a:
          type: int
          value: 100
        b:
          type: int
          value: 50
      outputs:
        result:
          type: int