          type: int
          value: 10
      outputs:
        result:
          type: int
        cpu_iterations:
          type: int
        io_operations:
          type: int
    
    # Task 9: High IO (concurrent with task 8)
    - id: 9
      image: "sum"  
      start: 10
      deadline: 40
      policy: "fifo"
      priority: 50
      depends_on: []        
      inputs:
        a: 
          type: int
          value: 20
        b:
          type: int
          value: 10
        io_percentage:
          type: int
          value: 80
      outputs:
