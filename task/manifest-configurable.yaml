version: "1.0"
schedule:
  name: "Configurable CPU/IO Benchmark"
  description: "Benchmark with configurable CPU/IO ratio using total_ops and io_percentage parameters"
  
  tasks:
    # Pure CPU workload
    - id: 1
      image: "sum"
      start: 10
      deadline: 30
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 1000
        io_percentage:
          type: int
          value: 50      
      outputs:
        result:
          type: int
    
    # 25% I/O
    - id: 2
      image: "sum"
      start: 20
      deadline: 40
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 1000
        io_percentage:
          type: int
          value: 50      
      outputs:
        result:
          type: int
    
    # 50% I/O (Balanced)
    - id: 3
      image: "sum"
      start: 30
      deadline: 50
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 1000
        io_percentage:
          type: int
          value: 50      
      outputs:
        result:
          type: int
    
    # 75% I/O
    - id: 4
      image: "sum"
      start: 40
      deadline: 60
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 1000
        io_percentage:
          type: int
          value: 50      
      outputs:
        result:
          type: int
    
    # Pure I/O workload
    - id: 5
      image: "sum"
      start: 50
      deadline: 70
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 1000
        io_percentage:
          type: int
          value: 50      
      outputs:
        result:
          type: int
    
    # High volume balanced workload
    - id: 6
      image: "sum"
      start: 60
      deadline: 80
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 1000
        io_percentage:
          type: int
          value: 50      
      outputs:
        result:
          type: int
    
    # Low volume I/O test
    - id: 7
      image: "sum"
      start: 70
      deadline: 90
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 1000
        io_percentage:
          type: int
          value: 50      
      outputs:
        result:
          type: int
    
    # High volume CPU test
    - id: 8
      image: "sum"
      start: 80
      deadline: 100
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 1000
        io_percentage:
          type: int
          value: 50      
      outputs:
        result:
          type: int
    
    # Mixed workload test
    - id: 9
      image: "sum"
      start: 90
      deadline: 110
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 1000
        io_percentage:
          type: int
          value: 50      
      outputs:
        result:
          type: int
    
    # Final balanced test
    - id: 10
      image: "sum"
      start: 100
      deadline: 120
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 1000
        io_percentage:
          type: int
          value: 50      
      outputs:
        result:
          type: int
