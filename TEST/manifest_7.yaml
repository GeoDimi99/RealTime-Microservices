version: "1.0"

images:
  base: "geodimi99/realtime-microservices:task-wrapper"
  repo: "geodimi99/realtime-microservices"
  tasks:
    - alias: "pusl"
      src: "sum1"
    - alias: "satcm"
      src: "sum2"
    - alias: "ssmapl"
      src: "sum3"
    - alias: "ssmapf"
      src: "sum4"
    - alias: "aocscm_pre"
      src: "sum5"
    - alias: "aocn"
      src: "sum6"
    - alias: "aocscm_post"
      src: "sum7"
    - alias: "cmg"
      src: "sum8"
    - alias: "aocn_cmg"
      src: "sum9"
    - alias: "orb"
      src: "sum10"
    - alias: "mhstr"
      src: "sum11"

schedule:
  name: "Satellite Operations Schedule"
  description: "AOCS/payload task schedule derived from Gantt chart"
  iterations: 1

  tasks:
    - id: 1
      image: "pusl"
      start: 0
      deadline: 14
      policy: "fifo"
      priority: 135
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 1000
        io_percentage:
          type: int
          value: 50
      outputs:
        result:
          type: int

    - id: 2
